name: Build Hoangha IPA

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods dependencies
        run: |
          cd pip_swift
          pod install --no-repo-update || pod install

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -workspace pip_swift/pip_swift.xcworkspace \
            -scheme pip_swift \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/pip_swift.app build/Payload/
          cd build
          zip -r -q Hoangha.ipa Payload
          ls -lh Hoangha.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hoangha-IPA
          path: build/Hoangha.ipa
          if-no-files-found: error

      - name: Release Latest IPA
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Hoangha Latest Build"
          body: "Bản build IPA tự động mới nhất của Hoangha. Hỗ trợ cài đặt qua TrollStore, AltStore, Sideloadly, Esign, Scarlet, v.v."
          files: build/Hoangha.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
